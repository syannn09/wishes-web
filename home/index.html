<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>选择主题</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="alternate icon" href="/assets/favicon.ico" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="theme-color" content="#0f1626" />
<style>
  :root{
    --bg:#0f1626; --bg-2:#1a2438; --card:#ffffff; --ink:#2a2d34; --ink-soft:#7b7f88;
    --magenta:#f90092; --pumpkin:#ff7a1a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{margin:0;min-height:100vh;min-height:100dvh;color:#fff;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(249,0,146,.22) 0%, rgba(249,0,146,0) 50%),
      radial-gradient(ellipse at 90% 100%, rgba(255,122,26,.2) 0%, rgba(255,122,26,0) 55%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
    display:flex;flex-direction:column;align-items:center;
    padding:34px 16px 28px;
    padding-top:calc(34px + env(safe-area-inset-top));padding-bottom:calc(28px + env(safe-area-inset-bottom));}
  header{text-align:center;margin-bottom:22px;}
  h1{margin:0;font-size:26px;font-size:clamp(22px,6vw,30px);letter-spacing:4px;font-weight:800;}
  header p{margin:8px 0 0;font-size:13px;color:rgba(255,255,255,.65);letter-spacing:1px;}

  .themes{width:100%;max-width:760px;display:grid;grid-template-columns:1fr;grid-gap:16px;gap:16px;}
  @media (min-width:640px){ .themes{grid-template-columns:1fr 1fr;grid-gap:20px;gap:20px;} }

  .theme{position:relative;display:block;text-decoration:none;color:var(--ink);background:var(--card);
    border-radius:20px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.35);
    transition:transform .2s ease, box-shadow .2s ease;}
  .theme:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(0,0,0,.45);}
  .theme:active{transform:scale(.98);}
  .cover{position:relative;height:0;padding-top:56.25%;background-size:cover;background-position:center;overflow:hidden;}
  @media (min-width:640px){ .cover{padding-top:75%;} }
  .info{padding:14px 16px 16px;display:flex;align-items:center;}
  .info .go{margin-left:12px;}
  .info .txt{flex:1;min-width:0;}
  .info h2{margin:0;font-size:18px;font-weight:800;letter-spacing:1px;}
  .info p{margin:4px 0 0;font-size:13px;color:var(--ink-soft);}
  .go{flex:none;border-radius:22px;padding:9px 16px;font-size:14px;font-weight:800;color:#fff;}
  .t-824 .go{background:var(--magenta);}
  .t-halloween .go{background:var(--pumpkin);}
  .badge{position:absolute;top:12px;left:12px;z-index:2;font-size:11px;font-weight:800;letter-spacing:1px;
    padding:4px 10px;border-radius:12px;background:var(--pumpkin);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);}

  /* 824 封面：樱花树图（CONFIG.HOME_COVERS 可换），加一层粉色柔光 */
  .t-824 .cover{background-color:#cfe6f5;background-position:center 70%;}
  .t-824 .cover::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;
    background:linear-gradient(180deg,rgba(255,255,255,0) 40%,rgba(249,0,146,.18) 100%);}
  /* 万圣节封面：没给图时用 CSS 画的夜空 + 门 */
  .t-halloween .cover{background-color:#060b16;
    background-image:
      radial-gradient(circle at 78% 26%, #fff4c8 0 7%, rgba(255,220,130,.35) 7.5%, rgba(255,220,130,0) 16%),
      radial-gradient(ellipse at 50% 120%, rgba(255,122,26,.45) 0%, rgba(255,122,26,0) 60%),
      linear-gradient(180deg,#060b16 0%,#1b2c4a 100%);}
  .t-halloween .cover.has-img{background-image:none;}
  .cover-door{position:absolute;left:50%;bottom:0;height:78%;transform:translateX(-50%);}
  .cover.has-img .cover-door{display:none;}
</style>
</head>
<body>
  <header>
    <h1>请选择主题</h1>
    <p>点一个进去看看</p>
  </header>

  <main class="themes">
    <a class="theme t-halloween" href="/halloween/">
      <span class="badge">NEW</span>
      <div class="cover" data-cover="halloween">
        <svg class="cover-door" viewBox="0 0 200 300" aria-hidden="true">
          <path fill-rule="evenodd" fill="#8c8f95" stroke="#1b1e24" stroke-width="3"
            d="M4 300 L4 104 A96 96 0 0 1 196 104 L196 300 Z M30 300 L30 110 A70 70 0 0 1 170 110 L170 300 Z"/>
          <path d="M30 288 L30 110 A70 70 0 0 1 170 110 L170 288 Z" fill="#ffc861"/>
          <path d="M170 288 L170 110 A70 70 0 0 0 136 50 L136 288 Z" fill="#5a1d0a" opacity=".35"/>
          <path d="M30 288 L30 110 L-4 80 L-4 300 Z" fill="#6b3f22" stroke="#14110e" stroke-width="4"/>
          <rect x="0" y="288" width="200" height="12" rx="3" fill="#6e7178" stroke="#1b1e24" stroke-width="3"/>
          <text x="100" y="230" font-size="60" text-anchor="middle">🎃</text>
        </svg>
      </div>
      <div class="info">
        <div class="txt">
          <h2>万圣街 1031</h2>
          <p>一扇扇门，到时间就能推开</p>
        </div>
        <span class="go">进入</span>
      </div>
    </a>

    <a class="theme t-824" href="/?from=home">
      <div class="cover" data-cover="824"></div>
      <div class="info">
        <div class="txt">
          <h2>树信归期 · 824</h2>
          <p>樱花树下的 52 封信</p>
        </div>
        <span class="go">进入</span>
      </div>
    </a>
  </main>

  <script src="/config.js?v=15"></script>
  <script>
    // 封面图：CONFIG.HOME_COVERS 有填就用，没填保留内建占位
    const covers = (window.CONFIG && window.CONFIG.HOME_COVERS) || {};
    document.querySelectorAll("[data-cover]").forEach(el=>{
      const src = covers[el.dataset.cover];
      if(!src) return;
      el.style.backgroundImage = `url("${src}")`;
      el.classList.add("has-img");
    });
  </script>
</body>
</html>

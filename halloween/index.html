<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>万圣之夜</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<style>
  :root{
    --night:#140a24; --night-2:#241040; --night-3:#3a1a5c;
    --pumpkin:#ff7a1a; --pumpkin-deep:#e2560b; --candle:#ffc861;
    --ghost:#f4f0ff; --slime:#9be15d;
    --paper:#f7eedb; --paper-edge:#dcc9a3;
    --ink:#2e2238; --ink-soft:#7d6f86;
    --door-w:260px;   /* halloween.js 的 sizeDoors() 会按屏幕改写成 px */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ghost);}
  /* iOS Safari 工具栏后面只画根元素底色：根元素也铺夜空色，不露白边 */
  /* iOS Safari（尤其新版浮动玻璃工具栏）后面画的是根元素 —— 根元素也铺同一片夜空渐层，
     撑到完整屏幕高度（lvh），工具栏后面才不会露出一条颜色不一样的带子 */
  /* 底色用渐层最「顶端」的深夜色：Safari 顶部状态栏那一条抓的是这个单一底色，
     和夜空最上面同色才接得起来（底部已由 #backdrop 盖满） */
  html{background:linear-gradient(180deg, var(--night) 0%, var(--night-2) 55%, var(--night-3) 100%) var(--night);
    min-height:100vh;min-height:100lvh;
  /* 外层整页锁住不能滚：#backdrop 撑到完整屏幕高（lvh）会比工具栏展开时的可视区域高，
     iOS Safari 有时无视 body 的 overflow，会整页被拖动 / 回弹。页面只在自己的区域里滑 */
  html{overflow:hidden;}
  /* 不设 position：背景层 #backdrop 要以整个屏幕为准定位，不能被 body 的 overflow 裁掉 */
  body{overflow:hidden;background:transparent;}

  /* ---------- 背景层容器 ----------
     新版 iOS Safari 会把「贴着屏幕边缘的 position:fixed 元素」的颜色，
     自己延伸成状态栏 / 工具栏后面的一整片纯色。
     所以夜空、月亮、星星、蝙蝠、雾都放在这个「一般的」容器里（absolute，不是 fixed），
     高度撑满完整屏幕（lvh，含工具栏后面），Safari 就会透出真正的夜空而不是纯色。
     页面本身不会滚动，absolute 和 fixed 看起来一样。 */
  #backdrop{position:absolute;top:0;left:0;right:0;height:100vh;height:100lvh;overflow:hidden;
    z-index:0;pointer-events:none;}
  /* 夜空底下再接一段同色（fixed，贴在可视区域正下方，不增加页面高度）：
     Safari 实际画到的区域比可视区域再低一点，工具栏下面那一小条才不会露出深色底 */
  #backdrop-tail{position:fixed;left:0;right:0;top:100%;height:40vh;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,#5c3868 0%,#3a1a5c 100%);}

  /* ---------- 背景：夜空 + 月亮 + 星星 + 雾（设计稿到了就换 BG_IMAGE）---------- */
  #sky{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 110%, rgba(255,122,26,.28) 0%, rgba(255,122,26,0) 55%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 55%, var(--night-3) 100%);
    background-size:cover;background-position:center;}
  #sky.has-img{background-size:cover;background-position:center bottom;}
  #moon{position:absolute;top:9vh;top:calc(9vh + env(safe-area-inset-top));right:9vw;z-index:0;pointer-events:none;
    width:24vw;height:24vw;max-width:130px;max-height:130px;border-radius:50%;
    background:radial-gradient(circle at 38% 36%, #fffbe6 0%, #ffe9a8 45%, #f3c96a 100%);
    box-shadow:0 0 40px 8px rgba(255,220,130,.35), 0 0 120px 30px rgba(255,200,100,.14);}
  #moon::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;
    background:radial-gradient(circle at 64% 60%, rgba(200,150,60,.22) 0 9%, transparent 10%),
               radial-gradient(circle at 34% 70%, rgba(200,150,60,.18) 0 6%, transparent 7%),
               radial-gradient(circle at 58% 28%, rgba(200,150,60,.16) 0 5%, transparent 6%);}
  #sky.has-img ~ #moon{display:none;}
  #stars{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
    animation:twinkle ease-in-out infinite alternate;}
  @keyframes twinkle{from{opacity:.15}to{opacity:.9}}
  .fog{position:absolute;left:-20%;right:-20%;z-index:2;pointer-events:none;height:34vh;bottom:-6vh;
    background:radial-gradient(ellipse at 30% 60%, rgba(190,170,230,.22) 0%, rgba(190,170,230,0) 60%),
               radial-gradient(ellipse at 75% 70%, rgba(190,170,230,.18) 0%, rgba(190,170,230,0) 55%);
    filter:blur(8px);animation:fogDrift 22s ease-in-out infinite alternate;}
  .fog.f2{bottom:-12vh;animation-duration:30s;animation-direction:alternate-reverse;opacity:.8;}
  @keyframes fogDrift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
  /* 飞过夜空的蝙蝠 */
  #bats{position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;overflow:hidden;}
  .bat{position:absolute;left:-60px;width:34px;color:#0b0514;opacity:.85;
    animation:batFly linear forwards;}
  .bat svg{display:block;width:100%;animation:flap .22s ease-in-out infinite alternate;transform-origin:50% 40%;}
  @keyframes batFly{
    0%  {transform:translate(0,0)}
    50% {transform:translate(55vw,var(--dip,-4vh))}
    100%{transform:translate(115vw,var(--rise,-10vh))}
  }
  @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}

  /* ---------- 顶部 ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:6;text-align:center;pointer-events:none;
    padding:12px 56px 10px;padding-top:calc(12px + env(safe-area-inset-top));}
  header h1{margin:0;font-size:24px;font-size:clamp(21px,5.6vw,28px);letter-spacing:4px;font-weight:800;color:var(--candle);
    text-shadow:0 0 14px rgba(255,160,60,.55), 0 2px 0 rgba(0,0,0,.35);}
  header p,#progress{text-shadow:0 1px 3px rgba(10,4,20,.9),0 0 8px rgba(10,4,20,.7);}
  header p{margin:5px 0 0;font-size:12px;font-size:clamp(11px,3vw,13px);color:rgba(244,240,255,.8);letter-spacing:1px;}
  #progress{margin-top:6px;font-size:12px;font-size:clamp(11px,3.1vw,13px);font-weight:700;color:var(--pumpkin);}
  #preview-flag{display:none;margin-top:6px;font-size:11px;color:#fff;font-weight:700;
    background:rgba(255,122,26,.8);border-radius:12px;padding:3px 12px;}
  body.is-preview #preview-flag{display:inline-block;}
  body.is-demo #preview-flag{display:inline-block;background:rgba(155,225,93,.85);color:#1a2a10;}

  .corner-btn{position:fixed;top:12px;top:calc(12px + env(safe-area-inset-top));z-index:8;width:38px;height:38px;
    border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(20,10,36,.55);color:var(--ghost);
    display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:0;}
  .corner-btn svg{width:18px;height:18px;}
  #btn-home{left:12px;}
  #btn-sound{right:12px;}
  #btn-sound .off{display:none;}
  body.muted #btn-sound .on{display:none;}
  body.muted #btn-sound .off{display:block;}

  /* ---------- 门的长廊：横向滑动，一次一扇，右边露出下一扇 ---------- */
  #rail{position:fixed;left:0;right:0;z-index:4;
    top:96px;bottom:92px;
    top:calc(96px + env(safe-area-inset-top));bottom:calc(92px + env(safe-area-inset-bottom));
    display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
    -webkit-scroll-snap-type:x mandatory;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding:0 calc((100vw - var(--door-w)) / 2);}
  #rail::-webkit-scrollbar{display:none;}
  .slide{flex:none;width:var(--door-w);scroll-snap-align:center;display:flex;flex-direction:column;
    align-items:center;transition:transform .35s ease,opacity .35s ease;
    transform:scale(.84);opacity:.55;}
  .slide + .slide{margin-left:20px;margin-left:clamp(14px,5vw,40px);}
  .slide.current{transform:none;opacity:1;}

  /* 一扇门 = 门框 + 门里的光 + 会转开的门板 + 锁 */
  .door{position:relative;width:100%;height:calc(var(--door-w) * 1.5);border:none;padding:0;background:none;
    cursor:pointer;-webkit-perspective:900px;perspective:900px;display:block;}
  .door-frame,.door-frame img,.door-frame svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;}
  .door-frame{z-index:1;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5));}
  /* 门洞位置（和占位门框的 SVG 对齐）：左 15% 上 13.3% 宽 70% 高 82.7%（站在台阶上），上缘拱形 */
  .door-hole{position:absolute;left:15%;top:13.333%;width:70%;height:82.667%;
    border-radius:50% 50% 0 0 / 28% 28% 0 0;}
  .door-inside{z-index:2;overflow:hidden;
    background:radial-gradient(ellipse at 50% 62%, #fff4c8 0%, #ffc861 22%, #ff7a1a 52%, #5a1d0a 100%);}
  .door-inside::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;
    background:radial-gradient(ellipse at 50% 60%, rgba(255,255,255,.0) 30%, rgba(40,10,0,.55) 100%);}
  .door-leaf{z-index:3;transform-origin:0 50%;transition:transform 1s cubic-bezier(.3,.05,.2,1);
    will-change:transform;}
  .door-leaf svg,.door-leaf img{width:100%;height:100%;display:block;object-fit:fill;}
  .door-lock{position:absolute;z-index:4;left:50%;top:60%;width:22%;transform:translateX(-50%);
    transition:opacity .4s,transform .4s;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));pointer-events:none;}
  .door-lock svg{width:100%;display:block;}

  /* 锁着：门暗一点，挂锁 */
  .door.locked .door-leaf{filter:brightness(.78) saturate(.8);}
  .door.locked .door-inside{opacity:0;}
  /* 能开：门缝透出暖光，微微呼吸 */
  .door.ready .door-lock{opacity:0;transform:translateX(-50%) translateY(14px) rotate(18deg);}
  .door.ready .door-leaf{filter:drop-shadow(0 0 10px rgba(255,190,90,.75));
    animation:readyGlow 2.2s ease-in-out infinite;}
  @keyframes readyGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,190,90,.55))}50%{filter:drop-shadow(0 0 18px rgba(255,190,90,.95))}}
  /* 开过的门：虚掩着 */
  .door.opened .door-lock{opacity:0;}
  .door.opened .door-leaf{transform:rotateY(32deg);animation:none;}
  /* 推门中：铰链在左，门板往里转（正角度 = 远离画面），转到 78° 贴在左边门框内侧，不会穿出门框 */
  .door.opening .door-leaf{transform:rotateY(78deg);animation:none;}
  .door.opening .door-inside{animation:insideFlash 1s ease-out;}
  @keyframes insideFlash{0%{filter:brightness(1)}45%{filter:brightness(1.6)}100%{filter:brightness(1.15)}}
  /* 锁着还点：门晃一下 */
  .door.rattle .door-leaf{animation:rattle .45s;}
  .door.rattle .door-lock{animation:lockShake .45s;}
  @keyframes rattle{0%,100%{transform:rotateY(0)}20%{transform:rotateY(5deg)}40%{transform:rotateY(-3deg)}60%{transform:rotateY(4deg)}80%{transform:rotateY(-2deg)}}
  @keyframes lockShake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-14deg)}75%{transform:translateX(-50%) rotate(12deg)}}
  /* 刚到时间：锁弹开 + 一圈光 */
  .door.just-unlocked::after{content:"";position:absolute;top:-6%;right:-6%;bottom:-6%;left:-6%;z-index:0;border-radius:50% 50% 12% 12%;
    background:radial-gradient(ellipse, rgba(255,200,97,.55) 0%, rgba(255,200,97,0) 65%);
    animation:justGlow 1.6s ease-out 2;}
  @keyframes justGlow{from{transform:scale(.7);opacity:1}to{transform:scale(1.2);opacity:0}}

  .door-meta{margin-top:12px;text-align:center;width:100%;min-height:62px;}
  .door-no{font-size:11px;letter-spacing:3px;color:rgba(244,240,255,.6);font-weight:700;}
  .door-title{margin-top:3px;font-size:15px;font-size:clamp(14px,4vw,16px);font-weight:800;color:var(--ghost);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .door-cd{margin-top:5px;font-size:13px;font-weight:700;color:var(--candle);font-variant-numeric:tabular-nums;}
  .door-cd.go{color:var(--slime);}
  .door-cd .when{display:block;font-size:11px;font-weight:500;color:rgba(244,240,255,.55);margin-top:2px;}

  /* ---------- 底部：翻页 ---------- */
  #pager{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;align-items:center;justify-content:center;
    padding:10px 14px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  #pager > * + *{margin-left:18px;}
  .nav-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
    background:rgba(20,10,36,.6);color:var(--ghost);cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .2s,transform .15s;}
  .nav-btn:active{transform:scale(.92);}
  .nav-btn:disabled{opacity:.25;cursor:default;}
  .nav-btn svg{width:18px;height:18px;}
  #page-no{min-width:64px;text-align:center;font-weight:800;font-size:14px;letter-spacing:1px;
    font-variant-numeric:tabular-nums;color:rgba(244,240,255,.85);}
  /* 第一次进来：提示可以往右滑 */
  #swipe-hint{position:fixed;left:0;right:0;z-index:7;text-align:center;pointer-events:none;
    bottom:66px;bottom:calc(66px + env(safe-area-inset-bottom));font-size:12px;color:rgba(244,240,255,.7);
    letter-spacing:1px;transition:opacity .5s;}
  #swipe-hint span{display:inline-block;animation:nudge 1.4s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  #swipe-hint.hide{opacity:0;}

  .empty{margin:auto;text-align:center;color:rgba(244,240,255,.8);font-size:14px;line-height:1.9;padding:0 24px;}

  /* ---------- 开门特效：飞出来的蝙蝠 / 火花 / 全屏一闪 ---------- */
  #fx{position:fixed;top:0;right:0;bottom:0;left:0;z-index:15;pointer-events:none;overflow:hidden;}
  .fx-bat{position:absolute;width:30px;color:#1a0d24;margin:-12px 0 0 -15px;
    animation:fxBat 1.1s cubic-bezier(.2,.6,.3,1) forwards;}
  .fx-bat svg{display:block;width:100%;animation:flap .16s ease-in-out infinite alternate;}
  @keyframes fxBat{
    from{transform:translate(0,0) scale(.3);opacity:0}
    15% {opacity:1}
    to  {transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}
  }
  .fx-spark{position:absolute;width:7px;height:7px;border-radius:50%;margin:-3px 0 0 -3px;
    animation:fxSpark .9s ease-out forwards;}
  @keyframes fxSpark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
  #flash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:14;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% 55%, rgba(255,210,120,.75) 0%, rgba(255,160,60,.25) 40%, rgba(255,160,60,0) 70%);}
  /* 平时 display:none：透明的全屏 fixed 元素也可能被 Safari 拿去补状态栏颜色 */
  #flash{display:none;}
  #flash.on{display:block;animation:flash .9s ease-out;}
  @keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}

  /* ---------- 门后的内容 ---------- */
  .overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:rgba(10,4,20,.6);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:16px;}
  .overlay.show{display:flex;}
  .sheet{position:relative;width:100%;max-width:420px;max-height:88vh;
    animation:sheetRise .45s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes sheetRise{from{transform:translateY(30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  .sheet-frame{background:linear-gradient(160deg,#3a1a5c,#1f0e36);border-radius:18px;padding:12px;
    border:1px solid rgba(255,122,26,.45);
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 26px 60px rgba(0,0,0,.55), 0 0 40px rgba(255,122,26,.18);}
  .sheet-paper{position:relative;background:var(--paper);color:var(--ink);border-radius:10px;
    padding:26px 22px 22px;max-height:calc(88vh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;
    background-image:
      radial-gradient(circle at 0 0, rgba(180,140,80,.18) 0, rgba(180,140,80,0) 38%),
      radial-gradient(circle at 100% 100%, rgba(180,140,80,.16) 0, rgba(180,140,80,0) 40%);}
  /* 纸角的小南瓜 / 蜘蛛网装饰 */
  .sheet-paper::before{content:"🎃";position:absolute;top:10px;left:12px;font-size:18px;opacity:.75;}
  .sheet-paper::after{content:"";position:absolute;top:0;right:0;width:56px;height:56px;pointer-events:none;opacity:.35;
    background:
      linear-gradient(225deg, transparent 49%, #6b5a70 49.5%, #6b5a70 50.5%, transparent 51%),
      radial-gradient(circle at 100% 0, transparent 14px, #6b5a70 14.5px, transparent 15.5px, transparent 28px, #6b5a70 28.5px, transparent 29.5px, transparent 42px, #6b5a70 42.5px, transparent 43.5px);}
  .sheet-close{position:absolute;top:-12px;right:-8px;width:34px;height:34px;border:none;border-radius:50%;
    background:var(--pumpkin);color:#fff;font-size:20px;line-height:1;cursor:pointer;z-index:3;
    box-shadow:0 4px 12px rgba(0,0,0,.4);}
  .sheet-no{text-align:center;font-size:11px;letter-spacing:3px;color:var(--ink-soft);margin-bottom:6px;}
  .sheet-title{text-align:center;margin:0 0 4px;font-size:22px;font-size:clamp(21px,5.6vw,26px);font-weight:800;
    color:#6a2c8a;letter-spacing:1px;line-height:1.3;}
  .sheet-rule{height:1px;background:linear-gradient(90deg,transparent,var(--paper-edge),transparent);margin:14px 0;}
  .sheet-body{white-space:pre-wrap;line-height:1.85;font-size:15px;}
  .sheet-media{width:100%;border-radius:10px;margin-top:14px;display:block;}
  .sheet-video{width:100%;height:52vw;max-height:230px;border-radius:10px;margin-top:14px;border:none;display:block;background:#000;}
  .sheet-link{display:block;text-align:center;margin-top:16px;background:var(--pumpkin);color:#fff;text-decoration:none;
    padding:12px 20px;border-radius:24px;font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(226,86,11,.35);}
  .sheet-author{display:flex;align-items:center;margin-top:18px;padding-top:14px;
    border-top:1px dashed var(--paper-edge);}
  .sheet-author .av{margin-right:11px;width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;
    background:linear-gradient(135deg,var(--pumpkin),#6a2c8a);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;}
  .sheet-author .n{font-weight:700;font-size:14px;color:var(--pumpkin-deep);}
  .sheet-author .b{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .teaser-img-wrap{position:relative;margin-top:14px;border-radius:10px;overflow:hidden;}
  .teaser-img-wrap img{width:100%;display:block;filter:blur(14px) saturate(1.1);transform:scale(1.12);}
  .teaser-img-wrap::after{content:"🔒";position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;
    justify-content:center;font-size:30px;background:rgba(255,255,255,.25);}
  .teaser-note{margin-top:16px;text-align:center;font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .teaser-countdown{margin-top:6px;text-align:center;font-size:17px;font-weight:800;color:var(--pumpkin-deep);
    letter-spacing:1px;font-variant-numeric:tabular-nums;}

  .toast{position:fixed;top:88px;top:calc(88px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;
    background:rgba(255,122,26,.95);color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;font-weight:700;
    opacity:0;transition:opacity .3s;max-width:86vw;text-align:center;pointer-events:none;}
  .toast.show{opacity:1;}

  /* 矮屏（横屏手机）：门缩小一点，别被上下栏夹住 */
  @media (max-height:560px){
    header p{display:none;}
    #rail{top:64px;top:calc(64px + env(safe-area-inset-top));}
  }
  @media (prefers-reduced-motion:reduce){
    .bat,.fog,.star,.door.ready .door-leaf,#swipe-hint span{animation:none!important;}
  }
</style>
</head>
<body>
  <div id="backdrop-tail"></div>
  <div id="backdrop">
    <div id="sky"></div>
    <div id="moon"></div>
    <div id="stars"></div>
    <div id="bats"></div>
    <div class="fog"></div>
    <div class="fog f2"></div>
  </div>

  <a class="corner-btn" id="btn-home" href="/home" aria-label="返回主题选择">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <button class="corner-btn" id="btn-sound" aria-label="音效开关">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>
  </button>

  <header>
    <h1 id="title">万圣之夜</h1>
    <p id="subtitle"></p>
    <div id="progress"></div>
    <div id="preview-flag"></div>
  </header>

  <div id="rail"></div>

  <div id="swipe-hint" class="hide"><span>滑动看下一扇门 →</span></div>
  <div id="pager">
    <button class="nav-btn" id="prev" aria-label="上一扇门">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div id="page-no"></div>
    <button class="nav-btn" id="next" aria-label="下一扇门">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div id="flash"></div>
  <div id="fx"></div>

  <!-- 门后的内容 -->
  <div class="overlay" id="door-modal">
    <div class="sheet">
      <button class="sheet-close" data-close aria-label="关闭">×</button>
      <div class="sheet-frame">
        <div class="sheet-paper" id="sheet-paper"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/config.js?v=13"></script>
  <!-- 演示数据：只在 ?demo=1 时真正被用到 -->
  <script src="/halloween/demo-doors.js?v=1"></script>
  <script src="/halloween/halloween.js?v=4"></script>
</body>
</html>

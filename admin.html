<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>树信归期 · 管理后台</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<link rel="alternate icon" href="./assets/favicon.ico" />
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
<meta name="theme-color" content="#32b5e1" />
<style>
  :root{--sky-blue:#32b5e1;--magenta:#f90092;--sakura:#f7b5cf;--ink:#3a3550;--soft:#eaf6fb;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
    min-height:100vh;padding:16px 12px 40px;position:relative;
    background:linear-gradient(160deg,#eaf6fb,#ffe6f4);}
  /* 樱花树背景：和粉丝页同一张图，后台模糊得更重，不干扰填内容 */
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background-image:url("./assets/sakura-bg.jpg");
    background-size:cover;background-position:center bottom;background-repeat:no-repeat;
    filter:blur(6px) saturate(.95);transform:scale(1.06);}
  body::after{content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(160deg,rgba(234,246,251,.82),rgba(255,230,244,.86));}
  h1{font-size:20px;text-align:center;
    background:linear-gradient(90deg,var(--sky-blue),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(120,80,140,.12);
    margin:0 auto 14px;max-width:660px;}
  input,textarea,select{width:100%;border:1.5px solid #bfe6f3;border-radius:10px;padding:10px;
    font-size:15px;font-family:inherit;margin-bottom:10px;outline:none;background:#fff;}
  input:focus,textarea:focus,select:focus{border-color:var(--magenta);}
  textarea{resize:vertical;min-height:70px;}
  label{font-size:12px;color:#7a7590;font-weight:600;display:block;margin-bottom:3px;}
  .btn{border:none;border-radius:24px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--magenta),var(--sky-blue));box-shadow:0 5px 14px rgba(249,0,146,.3);}
  .btn.small{padding:7px 14px;font-size:13px;}
  .btn.ghost{background:#f0f4f8;color:var(--magenta);box-shadow:none;}
  .btn.danger{background:#f4f4f6;color:#e0356b;box-shadow:none;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:520px){ .grid2{grid-template-columns:1fr;} }
  .letter{border:1px solid #eee;border-radius:14px;padding:14px;margin-bottom:12px;}
  .letter.live{border-color:var(--sky-blue);background:#f4fbff;}
  .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .badge.on{background:#d7f5e3;color:#1a9d5a;}
  .badge.off{background:#f0eef2;color:#998;}
  .muted{color:#998;font-size:12px;}
  .switch{margin-left:auto;}
  #gate .card{max-width:380px;margin-top:12vh;text-align:center;}
  .hidden{display:none;}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#3a3550;color:#fff;
    padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:50;font-size:14px;}
  .toast.show{opacity:1;}
  .thumb{max-width:100%;border-radius:8px;margin:6px 0;}
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .tab{border:none;border-radius:22px;padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer;
    background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(120,80,140,.12);}
  .tab.on{background:linear-gradient(135deg,var(--magenta),var(--sky-blue));color:#fff;}
  .author-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;
    background:linear-gradient(135deg,var(--sakura),var(--sky-blue));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;}
  .sec-title{font-size:13px;font-weight:700;color:var(--magenta);margin:14px 0 8px;
    padding-top:12px;border-top:1px dashed #e8dcc8;}
  .sec-title:first-child{border-top:none;padding-top:0;margin-top:0;}

  /* ---------- 上传区 ---------- */
  .up{border:2px dashed #bfe6f3;border-radius:12px;padding:14px;text-align:center;margin-bottom:10px;
    background:#fafdff;transition:border-color .2s,background .2s;cursor:pointer;}
  .up.over{border-color:var(--magenta);background:#fff5fb;}
  .up input[type=file]{display:none;}
  .up .up-tip{font-size:13px;color:#7a7590;line-height:1.6;}
  .up .up-tip b{color:var(--magenta);}
  .up .up-sub{font-size:11px;color:#aaa;margin-top:4px;}
  .up-bar{height:6px;border-radius:6px;background:#e8f2f8;overflow:hidden;margin-top:9px;display:none;}
  .up-bar.on{display:block;}
  .up-bar i{display:block;height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,var(--magenta),var(--sky-blue));transition:width .25s;}
  .up-done{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:9px 11px;
    background:#f4fbff;border:1px solid #bfe6f3;border-radius:11px;}
  .up-done .nm{font-size:12px;color:#5a7;word-break:break-all;flex:1;min-width:0;}
  .up-done .rm{border:none;background:#f4f4f6;color:#e0356b;border-radius:8px;
    padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;flex:none;}
</style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- 登录门 -->
  <div id="gate">
    <h1>管理后台</h1>
    <div class="card">
      <p class="muted">请输入管理密钥进入</p>
      <input id="keyInput" type="password" placeholder="管理密钥" />
      <button class="btn" id="loginBtn" style="width:100%;">进入</button>
      <p class="muted" style="margin-top:12px;">密钥只保存在这台设备上，别人打不开。</p>
    </div>
  </div>

  <!-- 管理区 -->
  <div id="panel" class="hidden">
    <h1>树信归期 · 管理后台</h1>

    <div class="tabs">
      <button class="tab on" data-tab="letters">📩 信件</button>
      <button class="tab"    data-tab="authors">👤 作者</button>
    </div>

    <!-- 信件页 -->
    <div id="tab-letters">
      <div class="card">
        <div class="row">
          <button class="btn" id="addBtn">＋ 新增一封信</button>
          <button class="btn ghost small" id="initBtn">初始化 48 封</button>
          <button class="btn ghost small" id="reloadBtn">刷新</button>
          <button class="btn ghost small" id="previewBtn">预览粉丝页</button>
          <button class="btn ghost small" id="logoutBtn">退出</button>
        </div>
        <p class="muted" style="margin:10px 0 0;">
          「上线」的信才会出现在粉丝页。<strong>解锁时段</strong>决定 824 当天几点开启；
          未到点粉丝只看得到<strong>预告</strong>，完整内容不会下发到前端。
        </p>
      </div>
      <div id="list"></div>
    </div>

    <!-- 作者页 -->
    <div id="tab-authors" class="hidden">
      <div class="card">
        <div class="row">
          <button class="btn" id="addAuthorBtn">＋ 新增作者</button>
          <button class="btn ghost small" id="reloadAuthorBtn">刷新</button>
        </div>
        <p class="muted" style="margin:10px 0 0;">
          一位作者对应一个作品（一封信）。在信件页把每封信指定给对应的作者。
        </p>
      </div>
      <div id="author-list"></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
  const $  = (s)=>document.querySelector(s);
  const $$ = (s)=>Array.from(document.querySelectorAll(s));
  const sb = window.supabase.createClient(window.CONFIG.SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY);
  let KEY = localStorage.getItem("yl_admin_key") || "";
  let AUTHORS = [];

  function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}
  function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function initial(n){return (n||"?").trim().charAt(0).toUpperCase();}
  function slotLabel(i){return `${String(Math.floor(i/2)).padStart(2,"0")}:${(i%2)===0?"00":"30"}`;}

  async function rpc(fn,args){
    const {data,error}=await sb.rpc(fn,args);
    if(error) throw error;
    return data;
  }

  /* ---------- 登录 ---------- */
  async function enter(){
    try{
      const [letters, authors] = await Promise.all([
        rpc("admin_list_letters",{p_key:KEY}),
        rpc("admin_list_authors",{p_key:KEY})
      ]);
      AUTHORS = authors || [];
      $("#gate").classList.add("hidden");
      $("#panel").classList.remove("hidden");
      render(letters);
      renderAuthors();
    }catch(e){
      console.warn(e);
      toast("密钥错误或连接失败");
      $("#gate").classList.remove("hidden");
      $("#panel").classList.add("hidden");
    }
  }

  $("#loginBtn").onclick=async ()=>{
    KEY=$("#keyInput").value.trim();
    if(!KEY){ toast("请输入密钥"); return; }
    localStorage.setItem("yl_admin_key",KEY);
    enter();
  };
  $("#logoutBtn").onclick=()=>{ localStorage.removeItem("yl_admin_key"); location.reload(); };
  $("#previewBtn").onclick=()=>{ window.open("./index.html?preview="+encodeURIComponent(KEY),"_blank"); };

  /* ---------- 分页切换 ---------- */
  $$(".tab").forEach(t=> t.onclick=()=>{
    $$(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    $("#tab-letters").classList.toggle("hidden", t.dataset.tab!=="letters");
    $("#tab-authors").classList.toggle("hidden", t.dataset.tab!=="authors");
  });

  /* ---------- 信件 ---------- */
  async function reloadLetters(){ render(await rpc("admin_list_letters",{p_key:KEY})); }
  $("#reloadBtn").onclick=async ()=>{ try{ await reloadLetters(); toast("已刷新"); }catch(e){ toast("刷新失败"); } };
  $("#addBtn").onclick=async ()=>{
    try{ await rpc("admin_add_letter",{p_key:KEY}); await reloadLetters(); toast("已新增一封，往下拉编辑"); }
    catch(e){ toast("新增失败"); }
  };
  $("#initBtn").onclick=async ()=>{
    if(!confirm("会补齐缺少的解锁时段（已有的不动）。继续？")) return;
    try{ await rpc("admin_init_slots",{p_key:KEY}); await reloadLetters(); toast("已初始化 48 个时段"); }
    catch(e){ toast("初始化失败：请先在 Supabase 建好 admin_init_slots"); }
  };

  function authorOptions(sel){
    return `<option value="">— 未指定作者 —</option>` + AUTHORS.map(a=>
      `<option value="${a.id}" ${String(sel)===String(a.id)?"selected":""}>${esc(a.name)}</option>`).join("");
  }

  /* ==========================================================
     图片上传（Supabase Storage）
     - 图片：可上传，也可以直接贴网址，两种都行
     - 影片：只贴网址（YouTube / Bilibili / mp4 直链）
     - 文件名带随机串，粉丝猜不到未解锁的素材网址
  ========================================================== */
  const BUCKET   = "letters";
  const MAX_IMG  = 15 * 1024 * 1024;   // 15MB（48 封 × 15MB ≈ 720MB，在免费版 1GB 内）

  function isUploaded(url){ return !!url && url.indexOf("/storage/v1/object/public/") > -1; }
  function fileLabel(url){
    if(!url) return "";
    try{ return decodeURIComponent(url.split("/").pop().split("?")[0]); }catch(_){ return url; }
  }
  function randomName(file){
    const ext  = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g,"");
    const rand = Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    return `${rand}.${ext}`;
  }

  // 图片控件：上传 或 贴网址，两种都支持；prefix 区分信件(f-)和作者(a-)
  function uploadField(field, value, kind, prefix){
    const cls    = (prefix || "f-") + field;
    const uped   = isUploaded(value);       // 是上传上来的文件
    const linked = !!value && !uped;        // 是贴的外部网址

    return `
      <div class="up-wrap" data-target="${cls}">
        <input type="hidden" class="${cls}" value="${esc(value)}"/>
        <div class="up-done" style="${uped?'':'display:none'}">
          <span class="nm">${uped ? esc(fileLabel(value)) : ""}</span>
          <button type="button" class="rm">移除</button>
        </div>
        <div class="up" style="${uped?'display:none':''}">
          <input type="file" accept="image/*"/>
          <div class="up-tip">拖图片到这里，或<b>点击选择</b>
            <div class="up-sub">最大 15MB · JPG / PNG / GIF / WebP</div>
          </div>
          <div class="up-bar"><i></i></div>
        </div>
        <div class="up-preview">${value ? `<img class="thumb" src="${esc(value)}" alt=""/>` : ""}</div>
        <div class="up-or" style="${uped?'display:none':''}">
          <label style="margin-top:8px">或：直接贴图片网址</label>
          <input class="up-url" value="${linked ? esc(value) : ""}" placeholder="https://..."/>
        </div>
      </div>`;
  }

  // 给一个容器里所有图片控件绑事件
  function bindUploads(root){
    root.querySelectorAll(".up-wrap").forEach(wrap=>{
      const hidden  = wrap.querySelector("."+wrap.dataset.target);
      const box     = wrap.querySelector(".up");
      const file    = wrap.querySelector('input[type=file]');
      const done    = wrap.querySelector(".up-done");
      const nameEl  = wrap.querySelector(".up-done .nm");
      const rmBtn   = wrap.querySelector(".rm");
      const bar     = wrap.querySelector(".up-bar");
      const barFill = wrap.querySelector(".up-bar i");
      const preview = wrap.querySelector(".up-preview");
      const urlIn   = wrap.querySelector(".up-url");
      const orBox   = wrap.querySelector(".up-or");

      box.onclick = ()=> file.click();
      box.addEventListener("dragover", e=>{ e.preventDefault(); box.classList.add("over"); });
      box.addEventListener("dragleave", ()=> box.classList.remove("over"));
      box.addEventListener("drop", e=>{
        e.preventDefault(); box.classList.remove("over");
        if(e.dataTransfer.files && e.dataTransfer.files[0]) doUpload(e.dataTransfer.files[0]);
      });
      file.onchange = ()=>{ if(file.files[0]) doUpload(file.files[0]); };

      // 贴网址：和上传二选一，贴了就实时预览
      urlIn.oninput = ()=>{
        if(isUploaded(hidden.value)) return;    // 已经传过文件了，别被网址覆盖
        const v = urlIn.value.trim();
        hidden.value = v;
        preview.innerHTML = v ? `<img class="thumb" src="${esc(v)}" alt=""/>` : "";
      };

      rmBtn.onclick = async ()=>{
        const old = hidden.value;
        hidden.value = "";
        done.style.display = "none";
        box.style.display  = "";
        orBox.style.display = "";
        preview.innerHTML  = "";
        urlIn.value = "";
        // 顺手把 Storage 里的旧文件删掉，别占空间
        if(isUploaded(old)){
          const path = old.split("/storage/v1/object/public/" + BUCKET + "/")[1];
          if(path) sb.storage.from(BUCKET).remove([decodeURIComponent(path)]).catch(()=>{});
        }
        toast("已移除，记得点「保存」");
      };

      async function doUpload(f){
        if(f.size > MAX_IMG){
          toast(`图片太大（${(f.size/1048576).toFixed(1)}MB），上限 15MB`);
          return;
        }
        bar.classList.add("on"); barFill.style.width = "15%";
        try{
          const path = randomName(f);
          barFill.style.width = "45%";
          const { error } = await sb.storage.from(BUCKET)
            .upload(path, f, { cacheControl:"31536000", upsert:false, contentType:f.type || undefined });
          if(error) throw error;
          barFill.style.width = "80%";

          const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
          hidden.value = data.publicUrl;

          nameEl.textContent  = fileLabel(data.publicUrl);
          done.style.display  = "";
          box.style.display   = "none";
          orBox.style.display = "none";
          preview.innerHTML   = `<img class="thumb" src="${esc(data.publicUrl)}" alt=""/>`;
          urlIn.value = "";

          barFill.style.width = "100%";
          setTimeout(()=>{ bar.classList.remove("on"); barFill.style.width="0"; }, 500);
          toast("上传成功，记得点「保存」");
        }catch(e){
          console.warn(e);
          bar.classList.remove("on"); barFill.style.width="0";
          toast(String(e.message||e).indexOf("Bucket not found") > -1
            ? "上传失败：请先在 Supabase 建 letters bucket"
            : "上传失败，请重试");
        }
        file.value = "";
      }
    });
  }

  function render(rows){
    const box=$("#list");
    if(!rows || !rows.length){ box.innerHTML='<div class="card muted">还没有信，点上面「新增一封信」或「初始化 48 封」开始。</div>'; return; }
    box.innerHTML=rows.map(L=>`
      <div class="card letter ${L.is_live?'live':''}" data-id="${L.id}">
        <div class="row" style="margin-bottom:10px;">
          <span class="badge ${L.is_live?'on':'off'}">${L.is_live?'● 已上线':'○ 未上线'}</span>
          <span class="muted">解锁 ${slotLabel(L.slot||0)}</span>
          <label class="switch row" style="margin:0;gap:6px;">
            <input type="checkbox" class="live" ${L.is_live?'checked':''} style="width:auto;margin:0;"/> 上线
          </label>
        </div>

        <div class="sec-title">基本</div>
        <label>标题</label>
        <input class="f-title" value="${esc(L.title)}" placeholder="例如 00:00 · 824快乐"/>
        <div class="grid2">
          <div>
            <label>解锁时段（0=00:00，1=00:30 … 47=23:30）</label>
            <input class="f-slot" type="number" min="0" max="47" value="${L.slot||0}"/>
          </div>
          <div>
            <label>物料作者</label>
            <select class="f-author">${authorOptions(L.author_id)}</select>
          </div>
        </div>

        <div class="sec-title">预告（未解锁时粉丝看到的）</div>
        <label>预告文字</label>
        <textarea class="f-teaser-text" placeholder="给一点悬念…">${esc(L.teaser_text)}</textarea>
        <label>预告图片（前端会自动打码模糊）</label>
        ${uploadField("teaser-image", L.teaser_image)}

        <div class="sec-title">完整内容（解锁后才下发）</div>
        <label>文字内容</label>
        <textarea class="f-body" placeholder="信的正文…">${esc(L.body)}</textarea>

        <label>影片网址（YouTube / Bilibili / mp4 直链）</label>
        <input class="f-video" value="${esc(L.video)}" placeholder="https://..."/>

        <label>图片</label>
        ${uploadField("image", L.image)}

        <label>链接</label>
        <input class="f-link" value="${esc(L.link)}" placeholder="https://..."/>
        <label>链接显示文字</label>
        <input class="f-linktext" value="${esc(L.link_text)}" placeholder="点击查看"/>

        <label>排序（数字小的排前面）</label>
        <input class="f-sort" type="number" value="${L.sort_order}"/>
        <div class="row">
          <button class="btn small save">保存这封</button>
          <button class="btn ghost small danger del">删除</button>
        </div>
      </div>
    `).join("");

    box.querySelectorAll(".letter").forEach(el=>{
      const id=+el.dataset.id;
      el.querySelector(".save").onclick=()=>saveOne(el,id);
      el.querySelector(".del").onclick=()=>delOne(id);
      el.querySelector(".live").onchange=()=>saveOne(el,id,true);
    });
    bindUploads(box);
  }

  async function saveOne(el,id,quiet){
    const g=(c)=>el.querySelector(c);
    const authorVal = g(".f-author").value;
    try{
      await rpc("admin_update_letter",{
        p_key:KEY, p_id:id,
        p_title:g(".f-title").value,
        p_body:g(".f-body").value,
        p_image:g(".f-image").value,
        p_video:g(".f-video").value,
        p_link:g(".f-link").value,
        p_link_text:g(".f-linktext").value,
        p_teaser_text:g(".f-teaser-text").value,
        p_teaser_image:g(".f-teaser-image").value,
        p_author_id: authorVal ? parseInt(authorVal) : null,
        p_slot: parseInt(g(".f-slot").value)||0,
        p_is_live:g(".live").checked,
        p_sort:parseInt(g(".f-sort").value)||0
      });
      toast(quiet?(g(".live").checked?"已上线 ✅":"已下线"):"已保存 ✅");
      if(quiet) await reloadLetters();
    }catch(e){ console.warn(e); toast("保存失败"); }
  }
  async function delOne(id){
    if(!confirm("确定删除这封信？")) return;
    try{ await rpc("admin_delete_letter",{p_key:KEY,p_id:id}); await reloadLetters(); toast("已删除"); }
    catch(e){ toast("删除失败"); }
  }

  /* ---------- 作者 ---------- */
  async function reloadAuthors(){
    AUTHORS = await rpc("admin_list_authors",{p_key:KEY}) || [];
    renderAuthors();
  }
  $("#reloadAuthorBtn").onclick=async ()=>{ try{ await reloadAuthors(); toast("已刷新"); }catch(e){ toast("刷新失败"); } };
  $("#addAuthorBtn").onclick=async ()=>{
    try{ await rpc("admin_add_author",{p_key:KEY}); await reloadAuthors(); toast("已新增作者"); }
    catch(e){ toast("新增失败"); }
  };

  function renderAuthors(){
    const box=$("#author-list");
    if(!AUTHORS.length){ box.innerHTML='<div class="card muted">还没有作者，点上面「新增作者」开始。</div>'; return; }
    box.innerHTML=AUTHORS.map(A=>`
      <div class="card" data-id="${A.id}">
        <div class="author-row">
          ${A.avatar?`<img class="av" src="${esc(A.avatar)}" alt="">`:`<div class="av">${esc(initial(A.name))}</div>`}
          <strong>${esc(A.name)}</strong>
        </div>
        <label>作者名</label>
        <input class="a-name" value="${esc(A.name)}" placeholder="作者名 / ID"/>
        <label>头像（可空，空则显示首字母）</label>
        ${uploadField("avatar", A.avatar, null, "a-")}
        <label>一句话介绍（可空）</label>
        <input class="a-bio" value="${esc(A.bio)}" placeholder="例如：画手 / 剪辑 / 写手"/>
        <label>排序</label>
        <input class="a-sort" type="number" value="${A.sort_order||0}"/>
        <div class="row">
          <button class="btn small a-save">保存</button>
          <button class="btn ghost small danger a-del">删除</button>
        </div>
      </div>
    `).join("");

    box.querySelectorAll("[data-id]").forEach(el=>{
      const id=+el.dataset.id;
      el.querySelector(".a-save").onclick=async ()=>{
        try{
          await rpc("admin_update_author",{
            p_key:KEY, p_id:id,
            p_name:el.querySelector(".a-name").value,
            p_avatar:el.querySelector(".a-avatar").value,
            p_bio:el.querySelector(".a-bio").value,
            p_sort:parseInt(el.querySelector(".a-sort").value)||0
          });
          await reloadAuthors();
          await reloadLetters();   // 下拉选项要同步更新
          toast("已保存 ✅");
        }catch(e){ toast("保存失败"); }
      };
      el.querySelector(".a-del").onclick=async ()=>{
        if(!confirm("删除这位作者？绑定他的信会变成「未指定作者」。")) return;
        try{ await rpc("admin_delete_author",{p_key:KEY,p_id:id}); await reloadAuthors(); await reloadLetters(); toast("已删除"); }
        catch(e){ toast("删除失败"); }
      };
    });
    bindUploads(box);
  }

  if(KEY) enter();
  </script>
</body>
</html>

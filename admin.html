<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>树信归期 · 管理后台</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<link rel="alternate icon" href="./assets/favicon.ico" />
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
<meta name="theme-color" content="#32b5e1" />
<style>
  :root{--sky-blue:#32b5e1;--magenta:#f90092;--sakura:#f7b5cf;--ink:#3a3550;--soft:#eaf6fb;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
    min-height:100vh;padding:16px 12px 40px;position:relative;
    background:linear-gradient(160deg,#eaf6fb,#ffe6f4);}
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background-image:url("./assets/sakura-bg.jpg");
    background-size:cover;background-position:center bottom;background-repeat:no-repeat;
    filter:blur(6px) saturate(.95);transform:scale(1.06);}
  body::after{content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(160deg,rgba(234,246,251,.86),rgba(255,230,244,.9));}
  h1{font-size:20px;text-align:center;
    background:linear-gradient(90deg,var(--sky-blue),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(120,80,140,.12);
    margin:0 auto 14px;max-width:1100px;}
  input,textarea,select{width:100%;border:1.5px solid #bfe6f3;border-radius:10px;padding:10px;
    font-size:15px;font-family:inherit;margin-bottom:10px;outline:none;background:#fff;}
  input:focus,textarea:focus,select:focus{border-color:var(--magenta);}
  textarea{resize:vertical;min-height:70px;}
  label{font-size:12px;color:#7a7590;font-weight:600;display:block;margin-bottom:3px;}
  .btn{border:none;border-radius:24px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;
    background:var(--magenta);box-shadow:0 5px 14px rgba(249,0,146,.3);}
  .btn.small{padding:7px 14px;font-size:13px;}
  .btn.ghost{background:#f0f4f8;color:var(--magenta);box-shadow:none;}
  .btn.danger{background:#f4f4f6;color:#e0356b;box-shadow:none;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:520px){ .grid2{grid-template-columns:1fr;} }
  .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .badge.on{background:#d7f5e3;color:#1a9d5a;}
  .badge.off{background:#f0eef2;color:#998;}
  .badge.warn{background:#fff0e0;color:#c47b1a;}
  .muted{color:#998;font-size:12px;}
  #gate .card{max-width:380px;margin-top:12vh;text-align:center;}
  .hidden{display:none!important;}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#3a3550;color:#fff;
    padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:80;font-size:14px;
    max-width:88vw;text-align:center;pointer-events:none;}
  .toast.show{opacity:1;}
  .thumb{max-width:100%;border-radius:8px;margin:6px 0;}
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .tab{border:none;border-radius:22px;padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer;
    background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(120,80,140,.12);}
  .tab.on{background:var(--magenta);color:#fff;}
  .sec-title{font-size:13px;font-weight:700;color:var(--magenta);margin:14px 0 8px;
    padding-top:12px;border-top:1px dashed #e8dcc8;}
  .sec-title:first-child{border-top:none;padding-top:0;margin-top:0;}

  /* ---------- 搜索列 ---------- */
  .search{position:relative;margin-bottom:0;}
  .search input{margin-bottom:0;padding-left:34px;}
  .search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);
    font-size:13px;opacity:.5;pointer-events:none;}

  /* ---------- 表格 ---------- */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px;}
  thead th{text-align:left;font-size:11px;font-weight:800;color:#8a85a0;letter-spacing:.5px;
    padding:8px 10px;border-bottom:2px solid #eef3f8;white-space:nowrap;background:#fff;
    position:sticky;top:0;z-index:2;}
  tbody td{padding:10px;border-bottom:1px solid #f2f5f9;vertical-align:middle;}
  tbody tr{transition:background .15s;}
  tbody tr:hover{background:#fafdff;}
  tbody tr.live-row{background:#f7fcff;}
  tbody tr.live-row:hover{background:#f0f9ff;}
  .c-time{font-weight:800;color:var(--magenta);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .c-title{font-weight:700;min-width:150px;}
  .c-title .sub{font-size:11px;color:#aaa;font-weight:400;margin-top:2px;}
  .c-author{white-space:nowrap;}
  .c-act{text-align:right;white-space:nowrap;}
  .no-author{color:#c47b1a;font-size:12px;font-weight:700;}
  .empty-row td{text-align:center;color:#998;padding:26px 10px;font-size:13px;}

  /* 拖动手柄 */
  .drag{cursor:grab;color:#c8cfda;font-size:17px;user-select:none;touch-action:none;
    padding:2px 4px;line-height:1;}
  .drag:active{cursor:grabbing;}
  tr.dragging{opacity:.4;}
  tr.drop-target td{box-shadow:inset 0 2px 0 var(--magenta);}

  /* ---------- 弹窗编辑器 ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(58,53,80,.5);backdrop-filter:blur(3px);
    z-index:60;display:none;align-items:flex-start;justify-content:center;padding:20px 12px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:620px;padding:20px;
    box-shadow:0 24px 60px rgba(0,0,0,.3);margin:auto;}
  .modal h3{margin:0 0 4px;font-size:18px;color:var(--magenta);}
  .modal .mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .modal .mhead .x{margin-left:auto;border:none;background:#f2f5f9;width:32px;height:32px;
    border-radius:50%;font-size:19px;cursor:pointer;color:var(--ink);line-height:1;}

  /* ---------- 上传区 ---------- */
  .up{border:2px dashed #bfe6f3;border-radius:12px;padding:14px;text-align:center;margin-bottom:10px;
    background:#fafdff;transition:border-color .2s,background .2s;cursor:pointer;}
  .up.over{border-color:var(--magenta);background:#fff5fb;}
  .up input[type=file]{display:none;}
  .up .up-tip{font-size:13px;color:#7a7590;line-height:1.6;}
  .up .up-tip b{color:var(--magenta);}
  .up .up-sub{font-size:11px;color:#aaa;margin-top:4px;}
  .up-bar{height:6px;border-radius:6px;background:#e8f2f8;overflow:hidden;margin-top:9px;display:none;}
  .up-bar.on{display:block;}
  .up-bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--magenta);transition:width .25s;}
  .up-done{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:9px 11px;
    background:#f4fbff;border:1px solid #bfe6f3;border-radius:11px;}
  .up-done .nm{font-size:12px;color:#5a7;word-break:break-all;flex:1;min-width:0;}
  .up-done .rm{border:none;background:#f4f4f6;color:#e0356b;border-radius:8px;
    padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;flex:none;}
  /* 多图列表 */
  .img-row{display:flex;align-items:center;gap:9px;margin-bottom:8px;padding:7px 9px;
    background:#f4fbff;border:1px solid #bfe6f3;border-radius:11px;}
  .img-row img{width:46px;height:46px;object-fit:cover;border-radius:8px;flex:none;background:#fff;}
  /* 影片行：上传的放缩略图，外链（YouTube/B站）没法取帧，放一个 🎬 占位 */
  .img-row video{width:46px;height:46px;object-fit:cover;border-radius:8px;flex:none;background:#000;}
  .img-row .vlink{width:46px;height:46px;border-radius:8px;flex:none;background:#f2f4f8;
    display:flex;align-items:center;justify-content:center;font-size:20px;}
  .img-row .nm{font-size:12px;color:#5a7;word-break:break-all;flex:1;min-width:0;}
  .img-row .rm{border:none;background:#f4f4f6;color:#e0356b;border-radius:8px;
    padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;flex:none;}
</style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- 登录门 -->
  <div id="gate">
    <h1>管理后台</h1>
    <div class="card">
      <p class="muted">请输入管理密钥进入</p>
      <input id="keyInput" type="password" placeholder="管理密钥" />
      <button class="btn" id="loginBtn" style="width:100%;">进入</button>
      <p class="muted" style="margin-top:12px;">密钥只保存在这台设备上，别人打不开。</p>
    </div>
  </div>

  <!-- 管理区 -->
  <div id="panel" class="hidden">
    <h1>树信归期 · 管理后台</h1>

    <div class="tabs">
      <button class="tab on" data-tab="letters">📩 信件</button>
      <button class="tab"    data-tab="authors">👤 作者</button>
    </div>

    <!-- ============ 信件 ============ -->
    <div id="tab-letters">
      <div class="card">
        <div class="row" style="margin-bottom:12px;">
          <button class="btn small" id="addBtn">＋ 新增一封信</button>
          <button class="btn ghost small" id="initBtn">初始化 52 封</button>
          <button class="btn ghost small" id="reloadBtn">刷新</button>
          <button class="btn ghost small" id="previewBtn">预览粉丝页</button>
          <button class="btn ghost small" id="logoutBtn" style="margin-left:auto;">退出</button>
        </div>
        <div class="search"><input id="q-letters" placeholder="搜索作品标题 或 作者名…" /></div>
        <p class="muted" style="margin:10px 0 0;">
          开启时间按客户时间表（0:24、0:30、1:00 … 23:30），可在编辑弹窗里改。
          拖动左边 <b>⠿</b> 调整顺序时，信件会<b>沿用整份时间表重新对号入座</b>。
          点整行打开编辑。「上线」的信才会出现在粉丝页。
        </p>
        <div id="letters-warn" class="muted" style="margin-top:8px;"></div>
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th style="width:30px"></th>
              <th style="width:64px">开启</th>
              <th>作品标题</th>
              <th style="width:130px">作者</th>
              <th style="width:78px">状态</th>
              <th style="width:120px"></th>
            </tr></thead>
            <tbody id="letters-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ============ 作者 ============ -->
    <div id="tab-authors" class="hidden">
      <div class="card">
        <div class="row" style="margin-bottom:12px;">
          <button class="btn small" id="addAuthorBtn">＋ 新增作者</button>
          <button class="btn ghost small" id="reloadAuthorBtn">刷新</button>
        </div>
        <div class="search"><input id="q-authors" placeholder="搜索作者名…" /></div>
        <p class="muted" style="margin:10px 0 0;">
          一位作者可以有<b>多个</b>作品（同一位作者可绑定多封信）。
        </p>
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>作者名</th>
              <th>介绍</th>
              <th style="width:170px">作品</th>
              <th style="width:120px"></th>
            </tr></thead>
            <tbody id="authors-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 信件编辑弹窗 ============ -->
  <div class="modal-bg" id="letter-modal">
    <div class="modal">
      <div class="mhead">
        <h3 id="lm-title">编辑信件</h3>
        <button class="x" data-close-modal>×</button>
      </div>

      <div class="sec-title">基本</div>
      <label>作品标题</label>
      <input class="f-title" placeholder="例如：主视觉 · 樱花树下的你们"/>
      <div class="grid2">
        <div>
          <label>开启时间</label>
          <input class="f-slot" type="time" />
        </div>
        <div>
          <label>作者</label>
          <select class="f-author"></select>
        </div>
      </div>
      <label class="row" style="gap:7px;margin-bottom:12px;">
        <input type="checkbox" class="f-live" style="width:auto;margin:0;"/>
        <span style="font-size:14px;font-weight:700;color:var(--ink)">上线（粉丝页可见）</span>
      </label>

      <div class="sec-title">预告（未解锁时粉丝看到的）</div>
      <label>预告文字</label>
      <textarea class="f-teaser-text" placeholder="给一点悬念…"></textarea>
      <label>预告图片（前端会自动打码模糊）</label>
      <div id="lm-teaser-up"></div>

      <div class="sec-title">完整内容（解锁后才下发）</div>
      <label>文字内容</label>
      <textarea class="f-body" placeholder="信的正文…"></textarea>
      <label>影片（上传 或 贴 YouTube / Bilibili 网址）</label>
      <div id="lm-video-up"></div>
      <label>图片（可放多张）</label>
      <div id="lm-images-up"></div>
      <label>链接</label>
      <input class="f-link" placeholder="https://..."/>
      <label>链接显示文字</label>
      <input class="f-linktext" placeholder="点击查看"/>

      <div class="row" style="margin-top:16px;">
        <button class="btn" id="lm-save">保存</button>
        <button class="btn ghost" data-close-modal>取消</button>
        <button class="btn danger" id="lm-del" style="margin-left:auto;">删除这封</button>
      </div>
    </div>
  </div>

  <!-- ============ 作者编辑弹窗 ============ -->
  <div class="modal-bg" id="author-modal">
    <div class="modal" style="max-width:460px;">
      <div class="mhead">
        <h3 id="am-title">编辑作者</h3>
        <button class="x" data-close-modal>×</button>
      </div>
      <label>作者名</label>
      <input class="a-name" placeholder="作者名 / ID"/>
      <label>介绍（例如：画手 / 剪辑 / 写手）</label>
      <input class="a-bio" placeholder="一句话介绍"/>
      <div class="row" style="margin-top:16px;">
        <button class="btn" id="am-save">保存</button>
        <button class="btn ghost" data-close-modal>取消</button>
        <button class="btn danger" id="am-del" style="margin-left:auto;">删除</button>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
  const $  = (s,r)=>(r||document).querySelector(s);
  const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
  const sb = window.supabase.createClient(window.CONFIG.SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY);
  let KEY = localStorage.getItem("yl_admin_key") || "";

  let AUTHORS = [];     // 全部作者
  let LETTERS = [];     // 全部信件（按 slot 排序）
  let editingLetter = null;
  let editingAuthor = null;

  function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400);}
  function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  // slot = 当天第几分钟开启（0:24 → 24）
  function slotLabel(mins){return `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`;}
  function slotToTimeValue(mins){return slotLabel(mins);}                    // input[type=time] 用
  function timeValueToSlot(v){ const [h,m]=(v||"0:0").split(":").map(Number); return (h||0)*60+(m||0); }

  async function rpc(fn,args){
    const {data,error}=await sb.rpc(fn,args);
    if(error) throw error;
    return data;
  }

  /* ================= 登录 ================= */
  async function enter(){
    try{
      await reloadAll();
      $("#gate").classList.add("hidden");
      $("#panel").classList.remove("hidden");
    }catch(e){
      console.warn(e);
      toast("密钥错误或连接失败");
      $("#gate").classList.remove("hidden");
      $("#panel").classList.add("hidden");
    }
  }
  async function reloadAll(){
    const [letters, authors] = await Promise.all([
      rpc("admin_list_letters",{p_key:KEY}),
      rpc("admin_list_authors",{p_key:KEY})
    ]);
    AUTHORS = authors || [];
    LETTERS = (letters || []).slice().sort((a,b)=>(a.slot||0)-(b.slot||0));
    renderLetters();
    renderAuthors();
  }

  $("#loginBtn").onclick=async ()=>{
    KEY=$("#keyInput").value.trim();
    if(!KEY){ toast("请输入密钥"); return; }
    localStorage.setItem("yl_admin_key",KEY);
    enter();
  };
  $("#logoutBtn").onclick=()=>{ localStorage.removeItem("yl_admin_key"); location.reload(); };
  $("#previewBtn").onclick=()=>{ window.open("./index.html?preview="+encodeURIComponent(KEY),"_blank"); };

  $$(".tab").forEach(t=> t.onclick=()=>{
    $$(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    $("#tab-letters").classList.toggle("hidden", t.dataset.tab!=="letters");
    $("#tab-authors").classList.toggle("hidden", t.dataset.tab!=="authors");
  });

  /* ================= 作者归属：一位作者可以有多个作品 ================= */
  // 作者 id → 他名下的所有信件
  function authorWorks(authorId){
    return LETTERS.filter(L => String(L.author_id) === String(authorId));
  }
  // 作者下拉不再过滤：同一位作者可以绑多封信
  function availableAuthors(){ return AUTHORS; }

  /* ================= 信件列表 ================= */
  $("#q-letters").oninput = renderLetters;

  function renderLetters(){
    const q = ($("#q-letters").value || "").trim().toLowerCase();
    const body = $("#letters-body");

    // 提示：还有几封没绑作者
    const noAuthor = LETTERS.filter(L=>!L.author_id).length;
    const warn = $("#letters-warn");
    if(!LETTERS.length){ warn.innerHTML=""; }
    else if(noAuthor){
      warn.innerHTML = `<span class="badge warn">⚠️ 还有 ${noAuthor} 封没绑作者</span>
        <span class="muted"> 牵红线需要至少 2 组「作品 + 作者」才玩得起来</span>`;
    }else{
      warn.innerHTML = `<span class="badge on">✅ 全部已绑定作者</span>`;
    }

    const rows = LETTERS.filter(L=>{
      if(!q) return true;
      const a = AUTHORS.find(x=>String(x.id)===String(L.author_id));
      return (L.title||"").toLowerCase().includes(q)
          || (a ? (a.name||"").toLowerCase().includes(q) : false);
    });

    if(!rows.length){
      body.innerHTML = `<tr class="empty-row"><td colspan="6">${
        LETTERS.length ? "没有符合搜索的信件" : "还没有信，点上面「新增一封信」或「初始化 52 封」开始。"
      }</td></tr>`;
      return;
    }

    const dragOK = !q;   // 搜索状态下不给拖（顺序会误导）
    body.innerHTML = rows.map(L=>{
      const a = AUTHORS.find(x=>String(x.id)===String(L.author_id));
      return `<tr data-id="${L.id}" class="${L.is_live?'live-row':''}">
        <td>${dragOK?'<span class="drag" title="拖动调整开启时间">⠿</span>':''}</td>
        <td class="c-time">${slotLabel(L.slot||0)}</td>
        <td class="c-title">${esc(L.title)||'<span class="muted">（未命名）</span>'}
          ${L.video||L.image ? `<div class="sub">${L.video?'🎬 影片 ':''}${L.image?'🖼 图片':''}</div>`:''}
        </td>
        <td class="c-author">${a ? esc(a.name) : '<span class="no-author">未绑定</span>'}</td>
        <td><span class="badge ${L.is_live?'on':'off'}">${L.is_live?'已上线':'未上线'}</span></td>
        <td class="c-act"><button class="btn ghost small edit-btn">编辑</button></td>
      </tr>`;
    }).join("");

    $$("#letters-body tr[data-id]").forEach(tr=>{
      const id = +tr.dataset.id;
      tr.querySelector(".edit-btn").onclick = (e)=>{ e.stopPropagation(); openLetterModal(id); };
      tr.onclick = ()=> openLetterModal(id);
      const h = tr.querySelector(".drag");
      if(h) h.addEventListener("pointerdown", e=> startDrag(e, tr));
    });
  }

  /* ---------- 拖动排序：直接改开启时间 ---------- */
  let dragState = null;
  function startDrag(e, tr){
    e.preventDefault(); e.stopPropagation();
    dragState = { tr, id:+tr.dataset.id };
    tr.classList.add("dragging");
    document.addEventListener("pointermove", onDragMove);
    document.addEventListener("pointerup", onDragEnd, {once:true});
  }
  function onDragMove(e){
    if(!dragState) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const over = el && el.closest("#letters-body tr[data-id]");
    $$("#letters-body tr").forEach(r=>r.classList.remove("drop-target"));
    if(over && over !== dragState.tr) over.classList.add("drop-target");
  }
  async function onDragEnd(e){
    if(!dragState) return;
    document.removeEventListener("pointermove", onDragMove);
    const { tr, id } = dragState;
    dragState = null;
    tr.classList.remove("dragging");
    const target = $("#letters-body tr.drop-target");
    $$("#letters-body tr").forEach(r=>r.classList.remove("drop-target"));
    if(!target) return;

    const fromIdx = LETTERS.findIndex(L=>L.id===id);
    const toIdx   = LETTERS.findIndex(L=>L.id===+target.dataset.id);
    if(fromIdx<0 || toIdx<0 || fromIdx===toIdx) return;

    // 时间表本身不变（0:24、1:09…），拖动只是让信件在这份时间表里换位置：
    // 先记下现有的时间序列，重排信件后按新顺序重新对号入座
    const times = LETTERS.map(L=>L.slot||0).sort((a,b)=>a-b);
    const arr = LETTERS.slice();
    const [moved] = arr.splice(fromIdx,1);
    arr.splice(toIdx,0,moved);

    const changed = [];
    arr.forEach((L,i)=>{ if(L.slot !== times[i]){ L.slot = times[i]; changed.push(L); } });
    LETTERS = arr;
    renderLetters();

    try{
      for(const L of changed) await saveLetterRow(L);
      toast(`已更新开启时间（${changed.length} 封）`);
    }catch(err){ console.warn(err); toast("排序保存失败"); await reloadAll(); }
  }

  // 用现有资料整笔保存（拖动排序用）
  function saveLetterRow(L){
    return rpc("admin_update_letter",{
      p_key:KEY, p_id:L.id,
      p_title:L.title||"", p_body:L.body||"", p_image:L.image||"",
      p_images:(typeof L.images==="string"?L.images:JSON.stringify(L.images||[])), p_video:L.video||"",
      p_videos:(typeof L.videos==="string"?L.videos:JSON.stringify(L.videos||[])),
      p_link:L.link||"", p_link_text:L.link_text||"",
      p_teaser_text:L.teaser_text||"", p_teaser_image:L.teaser_image||"",
      p_author_id:L.author_id||null, p_slot:L.slot||0,
      p_is_live:!!L.is_live, p_sort:L.slot||0
    });
  }

  /* ================= 信件编辑弹窗 ================= */
  function openLetterModal(id){
    const L = LETTERS.find(x=>x.id===id);
    if(!L) return;
    editingLetter = L;
    const m = $("#letter-modal");
    $("#lm-title").textContent = `编辑 · ${slotLabel(L.slot||0)}`;

    // 开启时间：直接填 HH:MM（撞到别的信会自动对调）
    $(".f-slot", m).value = slotToTimeValue(L.slot||0);

    // 作者下拉：只列还没被绑走的
    const list = availableAuthors();
    $(".f-author", m).innerHTML = `<option value="">— 未指定作者 —</option>` +
      list.map(a=>`<option value="${a.id}" ${String(L.author_id)===String(a.id)?"selected":""}>${esc(a.name)}</option>`).join("") +
      (AUTHORS.length ? "" : `<option disabled>（还没有作者，请先到作者页新增）</option>`);

    $(".f-title", m).value       = L.title || "";
    $(".f-live", m).checked      = !!L.is_live;
    $(".f-teaser-text", m).value = L.teaser_text || "";
    $(".f-body", m).value        = L.body || "";

    $(".f-link", m).value        = L.link || "";
    $(".f-linktext", m).value    = L.link_text || "";

    $("#lm-teaser-up").innerHTML = uploadField("teaser-image", L.teaser_image);
    $("#lm-video-up").innerHTML  = multiMediaField(letterVideos(L), "video");
    $("#lm-images-up").innerHTML = multiMediaField(letterImages(L), "image");
    bindUploads(m);
    bindMultiImage(m);
    bindMultiVideo(m);

    m.classList.add("show");
  }

  $("#lm-save").onclick = async ()=>{
    const L = editingLetter; if(!L) return;

      if(clash){ clash.slot = L.slot; await saveLetterRow(clash); }

        p_title:$(".f-title",m).value,

  /* ================= 弹窗开关 ================= */
  function closeModals(){

  $$("[data-close-modal]").forEach(b=> b.onclick = closeModals);

  addEventListener("keydown", e=>{ if(e.key==="Escape") closeModals(); });

  /* ==========================================================
     图片上传（Supabase Storage）
  ========================================================== */
  const BUCKET  = "letters";
  const MAX_IMG = 15 * 1024 * 1024;
  const MAX_VID = 10 * 1024 * 1024;   // 客户要求：影片单档 10MB

  function isUploaded(url){ return !!url && url.indexOf("/storage/v1/object/public/") > -1; }
  function fileLabel(url){
    if(!url) return "";
    try{ return decodeURIComponent(url.split("/").pop().split("?")[0]); }catch(_){ return url; }
  }
  function randomName(file){
    const ext  = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g,"");
    const rand = Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    return `${rand}.${ext}`;
  }

  // kind: "image"（预设）或 "video"
  function uploadField(field, value, kind){
    const isVid  = kind === "video";
    const cls    = "f-" + field;
    const uped   = isUploaded(value);
    const linked = !!value && !uped;
    const accept = isVid ? "video/*" : "image/*";
    const tip    = isVid
      ? `拖影片到这里，或<b>点击选择</b><div class="up-sub">最大 10MB · MP4 / WebM / MOV</div>`
      : `拖图片到这里，或<b>点击选择</b><div class="up-sub">最大 15MB · JPG / PNG / GIF / WebP</div>`;
    const urlLbl = isVid ? "或：贴影片网址（YouTube / Bilibili / mp4 直链）" : "或：直接贴图片网址";
    return `
      <div class="up-wrap" data-target="${cls}" data-kind="${isVid?'video':'image'}">
        <input type="hidden" class="${cls}" value="${esc(value)}"/>
        <div class="up-done" style="${uped?'':'display:none'}">
          <span class="nm">${uped ? esc(fileLabel(value)) : ""}</span>
          <button type="button" class="rm">移除</button>
        </div>
        <div class="up" style="${uped?'display:none':''}">
          <input type="file" accept="${accept}"/>
          <div class="up-tip">${tip}</div>
          <div class="up-bar"><i></i></div>
        </div>
        <div class="up-preview">${value ? mediaPreview(value, isVid) : ""}</div>
        <div class="up-or" style="${uped?'display:none':''}">
          <label style="margin-top:8px">${urlLbl}</label>
          <input class="up-url" value="${linked ? esc(value) : ""}" placeholder="https://..."/>
        </div>
      </div>`;
  }

  function mediaPreview(url, isVid){
    if(!url) return "";
    if(isVid && isUploaded(url))
      return `<video class="thumb" src="${esc(url)}" controls muted playsinline style="max-height:180px"></video>`;
    if(isVid) return `<div class="muted" style="margin:6px 0">🎬 ${esc(url)}</div>`;
    return `<img class="thumb" src="${esc(url)}" alt=""/>`;
  }

  /* ---------- 多图：一个作品可以放多张 ----------
     存进 letters.images（JSON 阵列）；旧的单图 letters.image 仍相容 */
  function letterImages(L){
    let arr = [];
    if(L.images){
      try{ arr = typeof L.images === "string" ? JSON.parse(L.images) : L.images; }catch(_){ arr = []; }
    }
    if(!Array.isArray(arr)) arr = [];
    if(!arr.length && L.image) arr = [L.image];      // 旧资料：单张升级成阵列
    return arr.filter(Boolean);
  }

  /* 多影片：存进 letters.videos（JSON 阵列）；旧的单支 letters.video 仍相容 */
  function letterVideos(L){
    let arr = [];
    if(L.videos){
      try{ arr = typeof L.videos === "string" ? JSON.parse(L.videos) : L.videos; }catch(_){ arr = []; }
    }
    if(!Array.isArray(arr)) arr = [];
    if(!arr.length && L.video) arr = [L.video];      // 旧资料：单支升级成阵列
    return arr.filter(Boolean);
  }

  /* 多图和多影片共用同一套组件，靠 kind 区分（"image" / "video"）。
     每种各自有一组 id：img-list/img-add/... 与 vid-list/vid-add/... */
  const MEDIA = {
    image: { p:"img", accept:"image/*",
             tip:'拖图片到这里，或<b>点击选择</b>（可一次选多张）',
             sub:"每张最大 15MB · JPG / PNG / GIF / WebP",
             urlLbl:"或：贴图片网址后按「加入」" },
    video: { p:"vid", accept:"video/*",
             tip:'拖影片到这里，或<b>点击选择</b>（可一次选多支）',
             sub:"每支最大 10MB · MP4 / WebM / MOV，或贴 YouTube / Bilibili 网址",
             urlLbl:"或：贴影片网址（YouTube / Bilibili / mp4 直链）后按「加入」" }
  };

  function multiMediaField(list, kind){
    const c = MEDIA[kind], p = c.p;
    return `
      <div id="${p}-list" data-kind="${kind}">${list.map(u=>mediaRowHTML(u,kind)).join("")}</div>
      <div class="up" id="${p}-add">
        <input type="file" accept="${c.accept}" multiple/>
        <div class="up-tip">${c.tip}
          <div class="up-sub">${c.sub}</div>
        </div>
        <div class="up-bar"><i></i></div>
      </div>
      <div style="margin-top:6px">
        <label>${c.urlLbl}</label>
        <div class="row">
          <input id="${p}-url" placeholder="https://..." style="flex:1;margin-bottom:0"/>
          <button type="button" class="btn ghost small" id="${p}-url-add">加入</button>
        </div>
      </div>`;
  }
  // 保留旧名字，其他地方还在用
  function multiImageField(list){ return multiMediaField(list, "image"); }

  function mediaRowHTML(url, kind){
    const thumb = kind === "video"
      ? (isUploaded(url)
          ? `<video src="${esc(url)}" muted playsinline preload="metadata"></video>`
          : `<span class="vlink">🎬</span>`)
      : `<img src="${esc(url)}" alt=""/>`;
    return `<div class="img-row" data-url="${esc(url)}">
      ${thumb}
      <span class="nm">${esc(fileLabel(url))}</span>
      <button type="button" class="rm">移除</button>
    </div>`;
  }
  function imgRowHTML(url){ return mediaRowHTML(url, "image"); }

  // 从画面读回目前的阵列
  function readMedia(kind){
    return $$(`#${MEDIA[kind].p}-list .img-row`).map(r=>r.dataset.url);
  }
  function readImages(){ return readMedia("image"); }
  function readVideos(){ return readMedia("video"); }

  function bindMultiImage(root){ bindMultiMedia(root, "image"); }
  function bindMultiVideo(root){ bindMultiMedia(root, "video"); }

  function bindMultiMedia(root, kind){
    const c = MEDIA[kind], p = c.p;
    const isVid = kind === "video";
    const maxSize = isVid ? MAX_VID : MAX_IMG;
    const maxLbl  = isVid ? "10MB" : "15MB";
    const unit    = isVid ? "支" : "张";

    const list = $(`#${p}-list`, root); if(!list) return;
    const box  = $(`#${p}-add`, root);
    const file = $('input[type=file]', box);
    const bar  = $(".up-bar", box), barFill = $(".up-bar i", box);

    function addUrl(u){
      if(!u) return;
      list.insertAdjacentHTML("beforeend", mediaRowHTML(u, kind));
      bindRows();
    }
    function bindRows(){
      $$(".img-row .rm", list).forEach(b=> b.onclick = ()=>{
        const row = b.closest(".img-row");
        const u = row.dataset.url;
        row.remove();
        if(isUploaded(u)){
          const path = u.split("/storage/v1/object/public/" + BUCKET + "/")[1];
          if(path) sb.storage.from(BUCKET).remove([decodeURIComponent(path)]).catch(()=>{});
        }
      });
    }
    bindRows();

    box.onclick = ()=> file.click();
    box.addEventListener("dragover", e=>{ e.preventDefault(); box.classList.add("over"); });
    box.addEventListener("dragleave", ()=> box.classList.remove("over"));
    box.addEventListener("drop", e=>{
      e.preventDefault(); box.classList.remove("over");
      uploadMany([...(e.dataTransfer.files||[])]);
    });
    file.onchange = ()=>{ uploadMany([...file.files]); file.value=""; };

    $(`#${p}-url-add`, root).onclick = ()=>{
      const inp = $(`#${p}-url`, root);
      const v = inp.value.trim();
      if(v){ addUrl(v); inp.value=""; toast("已加入，记得点「保存」"); }
    };

    async function uploadMany(files){
      const imgs = files.filter(f=>f.type.startsWith(isVid ? "video/" : "image/"));
      if(!imgs.length) return;
      bar.classList.add("on");
      let done = 0;
      for(const f of imgs){
        if(f.size > maxSize){ toast(`「${f.name}」超过 ${maxLbl}，已跳过`); done++; continue; }
        try{
          const path = randomName(f);
          const { error } = await sb.storage.from(BUCKET)
            .upload(path, f, { cacheControl:"31536000", upsert:false, contentType:f.type||undefined });
          if(error) throw error;
          addUrl(sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
        }catch(e){
          console.warn(e);
          toast(String(e.message||e).indexOf("Bucket not found")>-1
            ? "上传失败：请先在 Supabase 建 letters bucket" : `「${f.name}」上传失败`);
        }
        done++;
        barFill.style.width = Math.round(done/imgs.length*100) + "%";
      }
      setTimeout(()=>{ bar.classList.remove("on"); barFill.style.width="0"; }, 500);
      toast(`已上传 ${imgs.length} ${unit}，记得点「保存」`);
    }
  }

  function bindUploads(root){
    $$(".up-wrap", root).forEach(wrap=>{
      const hidden  = $("."+wrap.dataset.target, wrap);
      const box     = $(".up", wrap);
      const file    = $('input[type=file]', wrap);
      const done    = $(".up-done", wrap);
      const nameEl  = $(".up-done .nm", wrap);
      const rmBtn   = $(".rm", wrap);
      const bar     = $(".up-bar", wrap);
      const barFill = $(".up-bar i", wrap);
      const preview = $(".up-preview", wrap);
      const urlIn   = $(".up-url", wrap);
      const orBox   = $(".up-or", wrap);
      const isVid   = wrap.dataset.kind === "video";
      const maxSize = isVid ? MAX_VID : MAX_IMG;

      box.onclick = ()=> file.click();
      box.addEventListener("dragover", e=>{ e.preventDefault(); box.classList.add("over"); });
      box.addEventListener("dragleave", ()=> box.classList.remove("over"));
      box.addEventListener("drop", e=>{
        e.preventDefault(); box.classList.remove("over");
        if(e.dataTransfer.files && e.dataTransfer.files[0]) doUpload(e.dataTransfer.files[0]);
      });
      file.onchange = ()=>{ if(file.files[0]) doUpload(file.files[0]); };

      urlIn.oninput = ()=>{
        if(isUploaded(hidden.value)) return;
        const v = urlIn.value.trim();
        hidden.value = v;
        preview.innerHTML = v ? mediaPreview(v, isVid) : "";
      };

      rmBtn.onclick = async ()=>{
        const old = hidden.value;
        hidden.value = "";
        done.style.display = "none";
        box.style.display  = "";
        orBox.style.display = "";
        preview.innerHTML  = "";
        urlIn.value = "";
        if(isUploaded(old)){
          const path = old.split("/storage/v1/object/public/" + BUCKET + "/")[1];
          if(path) sb.storage.from(BUCKET).remove([decodeURIComponent(path)]).catch(()=>{});
        }
        toast("已移除，记得点「保存」");
      };

      async function doUpload(f){
        if(f.size > maxSize){
          toast(isVid ? `影片太大（${(f.size/1048576).toFixed(1)}MB），上限 10MB`
                      : `图片太大（${(f.size/1048576).toFixed(1)}MB），上限 15MB`);
          return;
        }
        bar.classList.add("on"); barFill.style.width = "15%";
        try{
          const path = randomName(f);
          barFill.style.width = "45%";
          const { error } = await sb.storage.from(BUCKET)
            .upload(path, f, { cacheControl:"31536000", upsert:false, contentType:f.type || undefined });
          if(error) throw error;
          barFill.style.width = "80%";

          const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
          hidden.value = data.publicUrl;

          nameEl.textContent  = fileLabel(data.publicUrl);
          done.style.display  = "";
          box.style.display   = "none";
          orBox.style.display = "none";
          preview.innerHTML   = mediaPreview(data.publicUrl, isVid);
          urlIn.value = "";

          barFill.style.width = "100%";
          setTimeout(()=>{ bar.classList.remove("on"); barFill.style.width="0"; }, 500);
          toast("上传成功，记得点「保存」");
        }catch(e){
          console.warn(e);
          bar.classList.remove("on"); barFill.style.width="0";
          toast(String(e.message||e).indexOf("Bucket not found") > -1
            ? "上传失败：请先在 Supabase 建 letters bucket"
            : "上传失败，请重试");
        }
        file.value = "";
      }
    });
  }

  if(KEY) enter();
  </script>
</body>
